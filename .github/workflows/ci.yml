# Runs on every pull request and on every push to main.
# Lint, claim check (scripts/claim-check.mjs), then a production build.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, claim check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Claim check
        run: npm run claim-check
        env:
          # Private never-name list, one term per line. Set it in
          # GitHub > Settings > Secrets and variables > Actions.
          CLAIM_CHECK_PRIVATE_TERMS: ${{ secrets.CLAIM_CHECK_PRIVATE_TERMS }}

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
